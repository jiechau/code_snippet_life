<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex, nocache">
    <title>open-meteo &mdash; open_meteo</title>
    <link rel="icon" href="../favicon.svg" type="image/svg+xml">
    <style>
        :root {
            --fg: #333;
            --muted: #777;
            --line: #e3e6ea;
            --accent: #2196F3;
            --err: #c0392b;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            color: var(--fg);
            margin: 0;
            padding: 24px 12px 60px;
        }
        .container {
            background: white;
            padding: 28px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 900px;
            margin: 0 auto;
        }
        h1 { margin: 0 0 4px; font-size: 1.6rem; }
        p.sub { margin: 0 0 22px; color: var(--muted); font-size: 0.9rem; }
        p.sub a { color: var(--accent); }
        p.sub code { background: #f0f2f5; padding: 1px 5px; border-radius: 4px; }
        a.back { color: var(--accent); text-decoration: none; font-size: 0.9rem; }
        a.back:hover { text-decoration: underline; }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
            gap: 14px;
        }
        .field { display: flex; flex-direction: column; }
        .field.wide { grid-column: 1 / -1; }
        label { font-size: 0.8rem; font-weight: 600; margin-bottom: 5px; }
        label .hint { font-weight: 400; color: var(--muted); }
        input, textarea {
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-size: 0.85rem;
            padding: 8px 10px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: #fbfcfd;
            color: var(--fg);
            resize: vertical;
        }
        input:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }

        /* location: a box just wide enough for "25.070602,121.592399", with
           使用目前位置 beside it and the saved spots wrapped onto a line of their
           own (.places is flex-basis: 100%). The button is the one control that
           has to stay within reach of the box -- it writes into it -- and the
           spots, being many and growing, are what gives way. */
        .locrow { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
        .locrow input { width: 200px; flex: 0 0 auto; }
        .places { display: flex; gap: 6px; flex-wrap: wrap; flex-basis: 100%; }
        .place {
            font: inherit;
            font-size: 0.85rem;
            font-weight: 600;
            padding: 6px 12px;
            border-radius: 999px;
            border: 1px solid var(--line);
            background: #f7f9fb;
            color: var(--accent);
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .place:hover { border-color: var(--accent); background: #eaf4fd; }
        .place[aria-pressed="true"] {
            background: var(--accent);
            border-color: var(--accent);
            color: white;
        }

        /* 使用目前位置 is an action, not a spot: it borrows the pill shape but is
           never pressed, and greys out while a fix is in flight. Its message --
           the accuracy, or why it failed -- sits beside it rather than in the
           result area, which belongs to the response. */
        .place.geo { color: var(--fg); }
        .place.geo:disabled { opacity: 0.55; cursor: default; }
        .geonote { font-size: 0.8rem; color: var(--muted); }
        .geonote.error { color: var(--err); }

        .actions { margin-top: 18px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        button {
            font: inherit;
            font-weight: 600;
            padding: 9px 22px;
            border-radius: 8px;
            border: 2px solid var(--accent);
            background: var(--accent);
            color: white;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        button:hover:not(:disabled) { background: #1976d2; border-color: #1976d2; }
        button:disabled { opacity: 0.55; cursor: default; }
        button.secondary { background: white; color: var(--accent); }
        button.secondary:hover:not(:disabled) { background: var(--accent); color: white; }

        .result { margin-top: 26px; border-top: 1px solid var(--line); padding-top: 20px; }
        .meta {
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-size: 0.8rem;
            color: var(--muted);
            margin-bottom: 10px;
        }
        .meta.error { color: var(--err); }
        .url {
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-size: 0.78rem;
            word-break: break-all;
            background: #f7f9fb;
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 10px 12px;
            margin-bottom: 12px;
        }
        .url a { color: var(--accent); text-decoration: none; }
        .url a:hover { text-decoration: underline; }
        pre {
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-size: 0.78rem;
            line-height: 1.45;
            background: #f7f9fb;
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 14px;
            margin: 0;
            max-height: 60vh;
            overflow: auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <a class="back" href="index.html">&larr; open_meteo</a>
        <h1>open-meteo</h1>
        <p class="sub">
            Browser port of <code>open-meteo.py</code>: one forecast call, printing the exact JSON the
            API returned plus <code>get_para</code> (the full request URL). No API key needed.
            Variable names for <code>hourly</code>/<code>daily</code> and the model ids come from
            the <a href="https://open-meteo.com/en/docs" target="_blank" rel="noopener">Open-Meteo
            API docs</a>.
        </p>

        <form id="form">
            <div class="grid">
                <div class="field">
                    <label for="forecast_days">forecast_days</label>
                    <input id="forecast_days" name="forecast_days" value="7" spellcheck="false">
                </div>
                <div class="field">
                    <label for="timezone">timezone</label>
                    <input id="timezone" name="timezone" value="auto" spellcheck="false">
                </div>
                <div class="field wide">
                    <label for="hourly">hourly <span class="hint">comma-separated; blank drops the parameter</span></label>
                    <textarea id="hourly" name="hourly" rows="3" spellcheck="false"></textarea>
                </div>
                <div class="field wide">
                    <label for="models">models <span class="hint">comma-separated; blank drops the parameter (bare keys, no model suffix)</span></label>
                    <textarea id="models" name="models" rows="2" spellcheck="false"></textarea>
                </div>
                <div class="field wide">
                    <label for="extra">extra params <span class="hint">one <code>key=value</code> per line; empty value drops a parameter. <code>daily=sunrise,sunset,moon_phase</code> is only echoed in the JSON. <code>past_days</code> takes 0&ndash;93, but the models only keep about 61 days of history &mdash; past that the hours come back empty</span></label>
                    <textarea id="extra" name="extra" rows="2" spellcheck="false" placeholder="forecast_hours=24"></textarea>
                </div>
                <div class="field wide">
                    <label for="location">location <span class="hint">lat,lon &mdash; or pick a spot, the device, or a point on the map</span></label>
                    <div class="locrow">
                        <input id="location" name="location" spellcheck="false">
                        <button type="button" class="place geo" id="geo" title="device GPS → the 輸入 spot">📍 使用目前位置</button>
                        <button type="button" class="place geo" id="mappick" title="OpenStreetMap → the 輸入 spot">🗺️ 在地圖上點選</button>
                        <span class="geonote" id="geonote"></span>
                        <div class="places" id="places"></div>
                    </div>
                </div>
            </div>

            <div class="actions">
                <button type="submit" id="submit">Fetch</button>
                <button type="button" class="secondary" id="reset">Reset defaults</button>
            </div>
        </form>

        <div class="result" id="result" hidden>
            <div class="meta" id="meta"></div>
            <div class="url" id="url"></div>
            <pre id="json"></pre>
        </div>
    </div>

<script src="../places.js"></script>
<script>
"use strict";

// Kept in step with open-meteo.py -- same endpoint, same URL construction, and
// the same "return the error body instead of throwing" behaviour. This request
// core is copied verbatim into open-meteo_readable.html and into
// astro_score/astro-score_readable.html -- three copies plus the script, so
// change one, change all.
// The block of form defaults below is instead shared with
// open-meteo_readable.html, so the two pages open on the same request; see the
// README for what that changes relative to the script.
const FORECAST_URL = "https://api.open-meteo.com/v1/forecast";

// PLACES (the saved spots offered as buttons beside the location box) and the
// DEFAULT_LAT/DEFAULT_LON derived from its first entry come from ../places.js,
// loaded just above. Add or reorder a spot there, not here.
const DEFAULT_DAYS = 7;

// Cloud decks run high -> mid -> low to match the row order of the grid in
// open-meteo_readable.html; open-meteo.py lists them low -> high. Same ten
// weather variables either way -- plus is_day, which only the grid needs but
// which is kept here too so both pages still open on the identical request.
const HOURLY_VARS = [
    "cloud_cover",
    "cloud_cover_high",
    "cloud_cover_mid",
    "cloud_cover_low",
    "visibility",
    "precipitation_probability",
    "relative_humidity_2m",
    "dew_point_2m",
    "wind_speed_10m",
    "temperature_2m",
    // Eleventh variable, one more than open-meteo.py asks for: the grid's 天氣
    // glyphs need to know day from night, and this is the only place Open-Meteo
    // says so. Nothing here is computed from the location any more, so without
    // it the row would show a sun at midnight.
    "is_day",
];

const MODELS = ["icon_global", "jma_seamless", "gfs_global", "ecmwf_ifs025"];

// Prefilled into the "extra params" box rather than added to defaultParams(),
// which stays identical to open-meteo.py. One key=value per line; clear a line to
// drop that parameter.
//
//   daily=  the only sun/moon figures the API has. moon_phase is a 0..1 cycle
//           position, not an illuminated fraction. Its keys get the same model
//           suffixing as hourly ones, so four models return twelve series -- all
//           identical, since this is pure astronomy.
//   past_days=  extends the series backwards, for comparing the forecast against
//           what actually happened. It is not free: 7 past days takes the
//           response from ~33 KB / 168 hours to ~64 KB / 336 hours, and
//           Open-Meteo bills by time range as well as variable count -- 61 days
//           is ~300 KB / 1632 hours. The API accepts 0..93, but the models'
//           rolling archive only reaches about 61 days back (the JMA models are
//           the shortest), so anything beyond that returns nulls rather than data.
const DEFAULT_EXTRA = [
    "daily=sunrise,sunset,moon_phase",
    "past_days=7",
].join("\n");

/** The request astro_score/milkyway.py makes, as a plain object. */
function defaultParams(lat, lon, days = DEFAULT_DAYS) {
    return {
        latitude: lat,
        longitude: lon,
        hourly: HOURLY_VARS.join(","),
        models: MODELS.join(","),
        timezone: "auto",
        forecast_days: days,
    };
}

/**
 * The full GET URL for a parameter object.
 *
 * Commas are left literal so the hourly/models lists stay readable and match
 * Open-Meteo's own documented examples; encodeURIComponent would otherwise
 * turn them into %2C. This exact string is what gets requested, so the
 * get_para handed back is the real URL rather than a reconstruction of it.
 * Spaces become "+" to match Python's urlencode.
 */
function buildUrl(params) {
    const query = Object.entries(params)
        .map(([key, value]) => {
            const enc = (s) => encodeURIComponent(String(s))
                .replace(/%2C/g, ",")
                .replace(/%20/g, "+");
            return `${enc(key)}=${enc(value)}`;
        })
        .join("&");
    return `${FORECAST_URL}?${query}`;
}

/**
 * Call the API and return {body, url, status, ok, bytes, seconds}.
 *
 * The body is exactly what Open-Meteo sent, decoded, plus the single added key
 * get_para. Errors are returned rather than thrown: Open-Meteo answers a bad
 * request with HTTP 400 and a JSON body like
 * {"error": true, "reason": "Latitude must be in range of -90 to 90°..."},
 * which is far more useful to see than a stack trace.
 */
async function fetchForecast(params, timeoutMs = 30000) {
    const url = buildUrl(params);
    const started = performance.now();
    const resp = await fetch(url, { signal: AbortSignal.timeout(timeoutMs) });
    const text = await resp.text();
    const seconds = (performance.now() - started) / 1000;

    let body;
    try {
        body = JSON.parse(text);
    } catch {
        // Not JSON at all -- hand back the raw text so the caller can see it.
        body = { error: true, reason: "response was not JSON", text: text };
    }
    body.get_para = url;

    return {
        body,
        url,
        status: resp.status,
        ok: resp.ok,
        contentType: resp.headers.get("Content-Type"),
        bytes: new TextEncoder().encode(text).length,
        seconds,
    };
}

/**
 * Build the request parameters from the form, mirroring parse_args(): a
 * "lat,lon" location plus key=value overrides, where an empty value drops the
 * parameter entirely -- handy for seeing how the response shape changes when
 * the model list goes away.
 */
function paramsFromForm() {
    const el = (id) => document.getElementById(id);
    const overrides = {};

    const loc = el("location").value.trim();
    let lat = DEFAULT_LAT, lon = DEFAULT_LON;
    if (loc) {
        const [latS, lonS] = loc.split(",");
        lat = Number(latS);
        lon = Number(lonS);
        if (!Number.isFinite(lat) || !Number.isFinite(lon)) {
            throw new Error(`Bad location "${loc}": expected "lat,lon"`);
        }
    }

    for (const id of ["forecast_days", "timezone", "hourly", "models"]) {
        overrides[id] = el(id).value.trim();
    }

    for (const line of el("extra").value.split("\n")) {
        const trimmed = line.trim();
        if (!trimmed) continue;
        if (!trimmed.includes("=")) {
            throw new Error(`Bad extra param "${trimmed}": expected "key=value"`);
        }
        const idx = trimmed.indexOf("=");
        overrides[trimmed.slice(0, idx).trim()] = trimmed.slice(idx + 1).trim();
    }

    const params = defaultParams(lat, lon);
    for (const [key, value] of Object.entries(overrides)) {
        if (value === "") delete params[key];
        else params[key] = value;
    }
    return params;
}

function resetDefaults() {
    document.getElementById("location").value = `${DEFAULT_LAT},${DEFAULT_LON}`;
    // ...and 輸入 -- PLACES[0] -- goes back to what places.js says, so the pill
    // matches the box again after 使用目前位置 has moved it. Rebuilt because the
    // coordinates a pill carries are baked into its dataset.
    setInputPlace(DEFAULT_LAT, DEFAULT_LON);
    buildPlaces();
    document.getElementById("forecast_days").value = String(DEFAULT_DAYS);
    document.getElementById("timezone").value = "auto";
    document.getElementById("hourly").value = HOURLY_VARS.join(",");
    document.getElementById("models").value = MODELS.join(",");
    document.getElementById("extra").value = DEFAULT_EXTRA;
    markActivePlace();
}

/**
 * Highlight whichever saved spot matches the box, so after a click it is clear
 * which one is showing -- and after a manual edit, that none of them is.
 */
function markActivePlace() {
    const current = document.getElementById("location").value.trim();
    for (const button of document.querySelectorAll(".place")) {
        button.setAttribute("aria-pressed", String(button.dataset.coords === current));
    }
}

/**
 * 使用目前位置 (use current position): the device's own coordinates into the
 * location box and into PLACES[0], the 輸入 spot, so its pill lights up like any
 * saved one and the box and the list agree. Then it refetches, exactly as clicking
 * a spot does -- a stale answer under a new location would mislead either way.
 *
 * Geolocation is a secure-context API, which makes this the one control here
 * that cannot work over file://. It fails as an ordinary rejection, and the
 * reason is printed beside the button rather than thrown, leaving whatever is
 * already on screen alone.
 */
async function useCurrentPosition() {
    const button = document.getElementById("geo");
    const note = document.getElementById("geonote");
    button.disabled = true;
    note.classList.remove("error");
    note.textContent = "定位中...";
    try {
        const { lat, lon, accuracy } = await currentPosition();
        setInputPlace(lat, lon);
        buildPlaces();   // the 輸入 pill carries coordinates in a dataset, so redraw it
        document.getElementById("location").value = `${lat},${lon}`;
        note.textContent = `±${Math.round(accuracy)} m`;
        markActivePlace();
        document.getElementById("form").requestSubmit();
    } catch (err) {
        note.classList.add("error");
        note.textContent = err.message;
    } finally {
        button.disabled = false;
    }
}

/**
 * 在地圖上點選 (pick on the map): the same write as 使用目前位置 -- box, 輸入,
 * pills, refetch -- from a real map rather than from the device. It is the
 * answer to "that ridge over there", which has a coordinate nobody knows by
 * heart and which no saved spot names.
 *
 * pickOnMap() (places.js) opens on whatever the box already holds, so the map
 * starts at the place on screen; anything unparseable there falls back to
 * places.js's default rather than reporting itself, since a half-typed
 * coordinate is about to be replaced by the one you point at. It never
 * rejects, and 取消 resolves null -- on which this leaves the box, the pills
 * and the grid exactly as they were.
 *
 * Unlike the GPS route there is no accuracy to report, so the .geonote is
 * cleared: a "±12 m" left over from an earlier fix would describe a coordinate
 * the box no longer holds.
 */
async function pickFromMap() {
    const button = document.getElementById("mappick");
    const note = document.getElementById("geonote");
    button.disabled = true;
    try {
        const [latS, lonS] = document.getElementById("location").value.trim().split(",");
        const lat = Number(latS), lon = Number(lonS);
        const picked = await pickOnMap(
            Number.isFinite(lat) && Number.isFinite(lon) ? { lat, lon } : {},
        );
        if (!picked) return;   // 取消
        setInputPlace(picked.lat, picked.lon);
        buildPlaces();   // the 輸入 pill carries coordinates in a dataset, so redraw it
        document.getElementById("location").value = `${picked.lat},${picked.lon}`;
        note.classList.remove("error");
        note.textContent = "";
        markActivePlace();
        document.getElementById("form").requestSubmit();
    } finally {
        button.disabled = false;
    }
}

/**
 * One button per saved spot. Clicking fills the box and refetches: leaving the
 * previous response on screen under a new location would just be misleading.
 */
function buildPlaces() {
    const box = document.getElementById("places");
    box.replaceChildren();   // 使用目前位置 moves 輸入, so this runs more than once
    for (const [name, lat, lon] of PLACES) {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "place";
        button.textContent = name;
        button.dataset.coords = `${lat},${lon}`;
        button.title = `${lat}, ${lon}`;
        button.addEventListener("click", () => {
            document.getElementById("location").value = button.dataset.coords;
            markActivePlace();
            document.getElementById("form").requestSubmit();
        });
        box.appendChild(button);
    }
}

function show({ meta, isError, url, json }) {
    const result = document.getElementById("result");
    const metaEl = document.getElementById("meta");
    const urlEl = document.getElementById("url");

    result.hidden = false;
    metaEl.textContent = meta;
    metaEl.classList.toggle("error", Boolean(isError));

    urlEl.hidden = !url;
    if (url) {
        urlEl.textContent = "";
        const a = document.createElement("a");
        a.href = url;
        a.target = "_blank";
        a.rel = "noopener";
        a.textContent = url;
        urlEl.appendChild(a);
    }

    document.getElementById("json").textContent = json || "";
}

/* BigDataCloud's keyless, CORS-enabled reverse geocoder: the place name under the
   meta line. A helper for the location box, in the same class as the map behind
   在地圖上點選 -- it labels the coordinate and feeds nothing on the page. */
const GEOCODE_URL = "https://api.bigdatacloud.net/data/reverse-geocode-client";
const geocodeCache = new Map();

/**
 * Turn a lat,lon into a readable place name for the meta line, e.g.
 * 中華民國/宜蘭縣/南澳鄉/蘇澳鎮 -- countryName, principalSubdivision, city and
 * locality, in that order.
 *
 * The coordinates are the requested ones, not the response's: Open-Meteo answers
 * with the nearest grid point (24.625, 121.75 for a spot at 24.5145, 121.8277),
 * which is up to ~6 km away and can sit in a different township. Sparse areas
 * and open water leave some of the four fields empty, and the last two can
 * repeat each other, so blanks and duplicates are dropped rather than shown.
 *
 * This is a label, never data: any failure resolves to "" and the meta line is
 * left exactly as the forecast wrote it.
 */
async function reverseGeocode(lat, lon, timeoutMs = 10000) {
    const key = `${lat},${lon}`;
    if (geocodeCache.has(key)) return geocodeCache.get(key);

    const url = `${GEOCODE_URL}?latitude=${encodeURIComponent(lat)}` +
        `&longitude=${encodeURIComponent(lon)}&localityLanguage=zh`;
    let name = "";
    try {
        const resp = await fetch(url, { signal: AbortSignal.timeout(timeoutMs) });
        if (resp.ok) {
            const body = await resp.json();
            name = [body.countryName, body.principalSubdivision, body.city, body.locality]
                .filter((part, i, all) => part && all.indexOf(part) === i)
                .join("/");
        }
    } catch {
        // Timed out or offline. The forecast itself is unaffected, so stay quiet.
    }
    geocodeCache.set(key, name);
    return name;
}

/**
 * Add the place name under a meta line once the lookup returns, as a second
 * line of its own -- the request summary is already long, and the name reads
 * better without it. Deliberately not awaited by the caller (the forecast is on
 * screen by then), so it re-checks the line first and gives up if a newer fetch
 * has replaced it.
 */
function appendPlaceName(metaEl, lat, lon) {
    const line = metaEl.textContent;
    reverseGeocode(lat, lon).then((name) => {
        if (!name || metaEl.textContent !== line) return;
        // A <br>, not a "\n": .meta wraps normally, so a newline character in
        // the text would come out as an ordinary space.
        metaEl.appendChild(document.createElement("br"));
        metaEl.appendChild(document.createTextNode(name));
    });
}

document.getElementById("form").addEventListener("submit", async (event) => {
    event.preventDefault();
    const button = document.getElementById("submit");

    let params;
    try {
        params = paramsFromForm();
    } catch (err) {
        show({ meta: err.message, isError: true, url: "", json: "" });
        return;
    }

    button.disabled = true;
    show({ meta: "fetching...", url: buildUrl(params), json: "" });

    try {
        const r = await fetchForecast(params);
        // The same one-line summary open-meteo.py prints to stderr. The JSON pane
        // below is still byte-for-byte what the API returned; only the meta line
        // gains a second line, and only as a label.
        show({
            meta: `HTTP ${r.status}  ${r.contentType}  ${r.bytes} bytes  ${r.seconds.toFixed(2)}s`,
            isError: !r.ok,
            url: r.url,
            json: JSON.stringify(r.body, null, 2),
        });
        // Fired after the response is on screen and never awaited, with the
        // requested coordinates rather than the grid point the API answered from.
        appendPlaceName(document.getElementById("meta"), params.latitude, params.longitude);
    } catch (err) {
        // Network-level failure -- no response at all, so nothing to show but why.
        show({
            meta: `request failed: ${err.name === "TimeoutError" ? "timed out" : err.message}`,
            isError: true,
            url: buildUrl(params),
            json: "",
        });
    } finally {
        button.disabled = false;
    }
});

document.getElementById("reset").addEventListener("click", resetDefaults);
